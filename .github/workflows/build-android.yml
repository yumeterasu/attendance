name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Was 25 -- past successful runs were already landing at 21-24 minutes
    # even before this session's changes (new font packages, more JS to
    # bundle), and this run finally tipped over and got killed mid-build at
    # the 25-minute mark. Raised with real headroom instead of trimming it
    # close again next time the app grows.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: attendance-app
    steps:
      - uses: actions/checkout@v4

      - name: Write .env (app needs this at bundle time, same as local dev)
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}" >> .env
          echo "EXPO_PUBLIC_API_KEY=${{ secrets.EXPO_PUBLIC_API_KEY }}" >> .env

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Restore signing credentials from secrets
        run: |
          mkdir -p credentials/android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > credentials/android/keystore.jks
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "credentials/android/keystore.jks",
                "keystorePassword": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
                "keyAlias": "${{ secrets.ANDROID_KEY_ALIAS }}",
                "keyPassword": "${{ secrets.ANDROID_KEY_PASSWORD }}"
              }
            }
          }
          EOF

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android

      - name: Tune Gradle memory for the CI runner
        run: |
          echo "org.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Inject env vars into eas.json's preview profile (belt-and-suspenders alongside step env)
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_API_KEY: ${{ secrets.EXPO_PUBLIC_API_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const easJson = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          easJson.build.preview.env = {
            EXPO_PUBLIC_API_URL: process.env.EXPO_PUBLIC_API_URL,
            EXPO_PUBLIC_API_KEY: process.env.EXPO_PUBLIC_API_KEY
          };
          fs.writeFileSync('eas.json', JSON.stringify(easJson, null, 2));
          "

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_API_KEY: ${{ secrets.EXPO_PUBLIC_API_KEY }}
        run: npx eas-cli build --platform android --profile preview --local --non-interactive --output ./build.apk

      - uses: actions/upload-artifact@v4
        with:
          name: attendance-app-apk
          path: attendance-app/build.apk
