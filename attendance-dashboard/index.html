<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Yume Terasu — Attendance Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #3E7BFA;
    --accent-dark: #2E63D6;
    --bg: #F7F9FC;
    --card: #ffffff;
    --border: #E4EBF9;
    --text: #12151C;
    --text-muted: #5C6B8A;
    --danger-bg: #FDECEA;
    --danger-border: #F1B3AB;
    --danger-text: #C0392B;
    --success-bg: #E4F6E9;
    --success-border: #B7E2C3;
    --success-text: #1E7B3A;
    --warn-bg: #FFF3E0;
    --warn-text: #B8631A;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-badge {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: #EEF3FC;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .brand-text h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 800;
  }

  .brand-text p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--text-muted);
  }

  #whoami {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    color: var(--text-muted);
  }

  #logoutBtn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
  }
  #logoutBtn:hover { background: #F4F7FD; }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ---------- Login ---------- */

  #loginView {
    display: flex;
    justify-content: center;
    padding-top: 60px;
  }

  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 1px 2px rgba(20,20,20,0.04), 0 16px 40px -20px rgba(62,123,250,0.25);
    text-align: center;
  }

  .login-card .brand-badge {
    margin: 0 auto 16px;
    width: 52px;
    height: 52px;
    font-size: 26px;
  }

  .login-card h2 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 800;
  }

  .login-card p.hint {
    margin: 0 0 24px;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .field {
    text-align: left;
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .field input, select {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }

  .field input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    background: #ffffff;
  }

  button.primary {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    padding: 13px;
    cursor: pointer;
    margin-top: 8px;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.primary:disabled { opacity: 0.6; cursor: default; }

  .error-msg {
    margin-top: 14px;
    font-size: 13px;
    color: var(--danger-text);
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    border-radius: 10px;
    padding: 10px 12px;
    display: none;
  }
  .error-msg.show { display: block; }

  /* ---------- Dashboard ---------- */

  #dashboardView { display: none; }

  .controls {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 24px;
  }

  .controls .field { margin-bottom: 0; flex: 0 0 140px; }
  .controls .field select { cursor: pointer; }

  .refresh-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-dark);
    background: #EEF3FC;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 16px;
    cursor: pointer;
    height: 45px;
  }
  .refresh-btn:hover { background: #E4EBFC; }
  .refresh-btn:disabled { opacity: 0.6; cursor: default; }
  .refresh-btn #refreshIcon {
    display: inline-block;
    font-size: 15px;
  }
  .refresh-btn.spinning #refreshIcon {
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .controls .spacer { flex: 1; }

  .controls .fiscal-hint {
    font-size: 12px;
    color: var(--text-muted);
    max-width: 220px;
    line-height: 1.4;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    background: #F4F7FD;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FAFBFF; }

  td.name { font-weight: 700; }
  td.dept { color: var(--text-muted); font-weight: 500; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }

  .pill {
    display: inline-block;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
  }
  .pill.late { background: var(--danger-bg); color: var(--danger-text); }
  .pill.otpay { background: var(--success-bg); color: var(--success-text); }
  .pill.zero { color: var(--text-muted); font-weight: 500; background: none; padding: 0; }

  .leave-badges {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }
  .leave-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--warn-bg);
    color: var(--warn-text);
    font-variant-numeric: tabular-nums;
  }

  #emptyState, #loadingState, #errorState {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }
  #errorState { color: var(--danger-text); display: none; }

  @media (max-width: 720px) {
    main { padding: 24px 12px 60px; }
    header { padding: 16px 18px; }
    .controls { flex-wrap: wrap; }
    table { font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-badge">📊</div>
    <div class="brand-text">
      <h1>Attendance Dashboard</h1>
      <p>Yume Terasu</p>
    </div>
  </div>
  <div id="whoami" style="display:none;">
    <span id="whoamiName"></span>
    <button id="logoutBtn">Log out</button>
  </div>
</header>

<main>

  <div id="loginView">
    <div class="login-card">
      <div class="brand-badge">🔒</div>
      <h2>Admin Sign In</h2>
      <p class="hint">Use the same username and one-time setup code an admin issues for a new device (Admin screen → "Lost Device / New Setup Code").</p>
      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" autocomplete="username" placeholder="EMP001" autocapitalize="characters" />
        </div>
        <div class="field">
          <label for="setupCode">Setup Code</label>
          <input id="setupCode" autocomplete="one-time-code" placeholder="123456" />
        </div>
        <button class="primary" type="submit" id="loginBtn">Sign In</button>
      </form>
      <div class="error-msg" id="loginError"></div>
    </div>
  </div>

  <div id="dashboardView">
    <div class="controls">
      <div class="field">
        <label for="yearSelect">Year</label>
        <select id="yearSelect"></select>
      </div>
      <div class="field">
        <label for="monthSelect">Month</label>
        <select id="monthSelect">
          <option value="1">January</option>
          <option value="2">February</option>
          <option value="3">March</option>
          <option value="4">April</option>
          <option value="5">May</option>
          <option value="6">June</option>
          <option value="7">July</option>
          <option value="8">August</option>
          <option value="9">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
          <option value="All">All (fiscal year)</option>
        </select>
      </div>
      <button class="refresh-btn" id="refreshBtn" type="button" title="Reload from Google Sheet">
        <span id="refreshIcon">↻</span> Refresh
      </button>
      <div class="spacer"></div>
      <p class="fiscal-hint" id="fiscalHint"></p>
    </div>

    <div class="card">
      <div id="loadingState">Loading…</div>
      <div id="errorState"></div>
      <div id="emptyState" style="display:none;">No employees to show for this period.</div>
      <table id="summaryTable" style="display:none;">
        <thead>
          <tr>
            <th>Employee</th>
            <th>Department</th>
            <th>Days Worked</th>
            <th>Late</th>
            <th>OT (min)</th>
            <th>OT (qtr)</th>
            <th>OT Pay</th>
            <th>Leave</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
  </div>

</main>

<script>
  // Points at the same Web App the Kiosk app uses -- same apiKey too,
  // already effectively public (shipped inside the distributed APK), so
  // reusing it here doesn't add a new exposure. Auth for what this page can
  // actually see is enforced by the sessionToken (see login()), same as the
  // in-app Admin screen -- checkApiKey_ alone never gates anything sensitive
  // on the backend.
  var API_URL = 'https://script.google.com/macros/s/AKfycbyfAUriIwgQlRjUv6cC1UKSazFW-KOrFd8a251bodchsBIa4On5ZZhji72Cjwsb-rYq/exec';
  var API_KEY = 'UgeFNcfax1LES5RhzPQ9XqG7OiHZwoYJ';

  var SESSION_KEY = 'attendance_dashboard_session_v1';

  function loadSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
    catch (e) { return null; }
  }
  function saveSession(session) {
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) {}
  }
  function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }

  // GET-only against this backend -- see Code.gs's doGet comment: this Web
  // App's CORS preflight (OPTIONS) response carries no
  // Access-Control-Allow-Origin header, so a browser blocks any POST with a
  // JSON body before it's even sent. Plain GET with query-string params
  // avoids the preflight requirement entirely.
  function apiGet(action, params) {
    var url = new URL(API_URL);
    url.searchParams.set('action', action);
    url.searchParams.set('apiKey', API_KEY);
    Object.keys(params || {}).forEach(function (k) { url.searchParams.set(k, params[k]); });
    return fetch(url.toString())
      .then(function (res) { return res.json(); })
      .catch(function () {
        return { success: false, error: 'network_error', message: 'Could not reach the server. Check your connection.' };
      });
  }

  // ---------- Login ----------

  var loginForm = document.getElementById('loginForm');
  var loginBtn = document.getElementById('loginBtn');
  var loginError = document.getElementById('loginError');

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var username = document.getElementById('username').value.trim();
    var setupCode = document.getElementById('setupCode').value.trim();
    if (!username || !setupCode) return;

    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in…';
    loginError.classList.remove('show');

    apiGet('pair', { username: username, setupCode: setupCode }).then(function (result) {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';

      if (!result.success) {
        loginError.textContent = result.message || 'Sign in failed.';
        loginError.classList.add('show');
        return;
      }
      if (!result.isAdmin) {
        loginError.textContent = 'This account is not an admin. Ask an admin to issue a code for an admin account instead.';
        loginError.classList.add('show');
        return;
      }
      saveSession({ sessionToken: result.sessionToken, name: result.name });
      showDashboard();
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', function () {
    clearSession();
    location.reload();
  });

  // ---------- Dashboard ----------

  var yearSelect = document.getElementById('yearSelect');
  var monthSelect = document.getElementById('monthSelect');
  var fiscalHint = document.getElementById('fiscalHint');

  function populateYears() {
    var thisYear = new Date().getFullYear();
    for (var y = thisYear + 1; y >= thisYear - 3; y--) {
      var opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      if (y === thisYear) opt.selected = true;
      yearSelect.appendChild(opt);
    }
  }

  function updateFiscalHint() {
    var year = yearSelect.value;
    if (monthSelect.value === 'All') {
      fiscalHint.textContent = '"All" covers the fiscal year: April ' + year + ' – March ' + (Number(year) + 1) + '.';
    } else {
      fiscalHint.textContent = '';
    }
  }

  var otPayFormatter = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function formatLeaveCount(n) {
    return n % 1 === 0 ? String(n) : n.toFixed(1);
  }

  function renderRows(employees) {
    var body = document.getElementById('summaryBody');
    body.innerHTML = '';

    employees.forEach(function (emp) {
      var tr = document.createElement('tr');

      var leaveBadges = [];
      if (emp.leave.annual) leaveBadges.push('Annual ' + formatLeaveCount(emp.leave.annual));
      if (emp.leave.sick) leaveBadges.push('Sick ' + formatLeaveCount(emp.leave.sick));
      if (emp.leave.paidSpecial) leaveBadges.push('Paid Special ' + formatLeaveCount(emp.leave.paidSpecial));
      if (emp.leave.unpaid) leaveBadges.push('Unpaid ' + formatLeaveCount(emp.leave.unpaid));
      var leaveHtml = leaveBadges.length
        ? '<div class="leave-badges">' + leaveBadges.map(function (b) { return '<span class="leave-badge">' + b + '</span>'; }).join('') + '</div>'
        : '<span class="pill zero">—</span>';

      var lateHtml = emp.lateCount > 0
        ? '<span class="pill late">' + emp.lateCount + '</span>'
        : '<span class="pill zero">0</span>';

      var otPayHtml = emp.otPay === null
        ? '<span class="pill zero">—</span>'
        : (emp.otPay > 0 ? '<span class="pill otpay">฿' + otPayFormatter.format(emp.otPay) + '</span>' : '<span class="pill zero">฿0.00</span>');

      tr.innerHTML =
        '<td class="name">' + escapeHtml(emp.name) + '</td>' +
        '<td class="dept">' + escapeHtml(emp.department || '') + '</td>' +
        '<td class="num">' + emp.daysWorked + '</td>' +
        '<td class="num">' + lateHtml + '</td>' +
        '<td class="num">' + emp.otMinutes + '</td>' +
        '<td class="num">' + emp.otQuarters + '</td>' +
        '<td class="num">' + otPayHtml + '</td>' +
        '<td>' + leaveHtml + '</td>';
      body.appendChild(tr);
    });
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function setRefreshing(isRefreshing) {
    var btn = document.getElementById('refreshBtn');
    btn.disabled = isRefreshing;
    btn.classList.toggle('spinning', isRefreshing);
  }

  function loadSummary() {
    var session = loadSession();
    if (!session) return;

    setRefreshing(true);
    document.getElementById('loadingState').style.display = 'block';
    document.getElementById('errorState').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('summaryTable').style.display = 'none';

    apiGet('dashboardSummary', {
      sessionToken: session.sessionToken,
      year: yearSelect.value,
      month: monthSelect.value
    }).then(function (result) {
      setRefreshing(false);
      document.getElementById('loadingState').style.display = 'none';

      if (!result.success) {
        if (result.error === 'session_expired' || result.error === 'forbidden') {
          clearSession();
          location.reload();
          return;
        }
        document.getElementById('errorState').textContent = result.message || 'Something went wrong.';
        document.getElementById('errorState').style.display = 'block';
        return;
      }

      if (result.employees.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }

      renderRows(result.employees);
      document.getElementById('summaryTable').style.display = 'table';
    });
  }

  yearSelect.addEventListener('change', function () { updateFiscalHint(); loadSummary(); });
  monthSelect.addEventListener('change', function () { updateFiscalHint(); loadSummary(); });
  document.getElementById('refreshBtn').addEventListener('click', loadSummary);

  function showDashboard() {
    var session = loadSession();
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('dashboardView').style.display = 'block';
    document.getElementById('whoami').style.display = 'flex';
    document.getElementById('whoamiName').textContent = session.name;
    updateFiscalHint();
    loadSummary();
  }

  // ---------- Boot ----------

  populateYears();
  monthSelect.value = String(new Date().getMonth() + 1);

  if (loadSession()) {
    showDashboard();
  }
</script>

</body>
</html>
