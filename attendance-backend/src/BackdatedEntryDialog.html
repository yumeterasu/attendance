<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; padding: 4px 8px 12px; color: #202124; }
    label { display: block; margin-top: 14px; margin-bottom: 4px; font-weight: bold; }
    input[type="text"], input[type="time"], input[type="date"] {
      width: 100%; padding: 7px 8px; box-sizing: border-box; font-size: 14px;
      border: 1px solid #ccc; border-radius: 4px; background: #fff; font-family: inherit;
    }
    .type-buttons { display: flex; gap: 8px; }
    .type-btn {
      flex: 1; padding: 10px 4px; border: 2px solid #ccc; border-radius: 6px;
      background: #f5f5f5; cursor: pointer; text-align: center; font-size: 13px; user-select: none;
    }
    .dropdown-wrap { position: relative; }
    .dropdown-display {
      width: 100%; padding: 7px 8px; box-sizing: border-box; font-size: 14px;
      border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer;
      color: #999; user-select: none;
    }
    .dropdown-display.has-value { color: #202124; }
    .dropdown-list {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 10; margin-top: 2px;
      max-height: 170px; overflow-y: auto; background: #fff; border: 1px solid #ccc;
      border-radius: 4px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    }
    .dropdown-item { padding: 8px; cursor: pointer; font-size: 14px; }
    .dropdown-item:hover { background: #eef2ff; }
    #submitBtn {
      margin-top: 20px; width: 100%; padding: 11px; font-size: 14px;
      background: #4285f4; color: white; border: none; border-radius: 6px; cursor: pointer;
    }
    #submitBtn:disabled { background: #aaa; cursor: default; }
    #error { color: #c5221f; margin-top: 8px; min-height: 16px; font-size: 12px; }
  </style>
</head>
<body>
  <label>Employee</label>
  <div class="dropdown-wrap" id="employeeWrap">
    <div class="dropdown-display" id="employeeDisplay">Select employee...</div>
    <div class="dropdown-list" id="employeeList" style="display: none;"></div>
  </div>

  <label>Type</label>
  <div class="type-buttons">
    <div class="type-btn in" data-type="IN">IN</div>
    <div class="type-btn out" data-type="OUT">OUT</div>
    <div class="type-btn outot" data-type="OUT_OT">OUT OT</div>
  </div>

  <label for="date">Date</label>
  <input type="date" id="date">

  <label for="time">Time (24-hour)</label>
  <input type="time" id="time">

  <div id="error"></div>
  <button id="submitBtn">Add</button>

  <script>
    var selectedType = null;
    var TYPE_COLORS = {
      IN: { bg: '#c8e6c9', border: '#7cb987' },
      OUT: { bg: '#ffe0b2', border: '#e0a95f' },
      OUT_OT: { bg: '#bbdefb', border: '#6fa8dc' }
    };

    function showError(msg) {
      document.getElementById('error').textContent = msg || '';
    }

    function setupTypeButtons() {
      var buttons = document.querySelectorAll('.type-btn');
      Array.prototype.forEach.call(buttons, function (btn) {
        btn.addEventListener('click', function () {
          Array.prototype.forEach.call(buttons, function (b) {
            b.style.background = '#f5f5f5';
            b.style.borderColor = '#ccc';
          });
          var colors = TYPE_COLORS[btn.getAttribute('data-type')];
          btn.style.background = colors.bg;
          btn.style.borderColor = colors.border;
          selectedType = btn.getAttribute('data-type');
        });
      });
    }
    setupTypeButtons();

    var selectedEmployeeName = '';

    // A plain <select> isn't reliable here -- the browser's native dropdown
    // popup doesn't consistently open inside Apps Script's sandboxed dialog
    // iframe. This click-list works the same way the IN/OUT/OUT OT buttons
    // above already do, so it's proven to work in this exact environment.
    function loadEmployeeList() {
      google.script.run
        .withSuccessHandler(function (list) {
          var listEl = document.getElementById('employeeList');
          var display = document.getElementById('employeeDisplay');
          if (!list || !list.length) {
            display.textContent = 'No active employees found';
            return;
          }
          list.forEach(function (emp) {
            var item = document.createElement('div');
            item.className = 'dropdown-item';
            item.textContent = emp.name;
            item.addEventListener('click', function () {
              selectedEmployeeName = emp.name;
              display.textContent = emp.name;
              display.classList.add('has-value');
              listEl.style.display = 'none';
            });
            listEl.appendChild(item);
          });
        })
        .withFailureHandler(function (err) {
          showError('Could not load employee list: ' + (err && err.message ? err.message : err));
        })
        .getEmployeeListForDialog_();
    }
    loadEmployeeList();

    document.getElementById('employeeDisplay').addEventListener('click', function () {
      var listEl = document.getElementById('employeeList');
      listEl.style.display = listEl.style.display === 'none' ? 'block' : 'none';
    });
    document.addEventListener('click', function (e) {
      if (!document.getElementById('employeeWrap').contains(e.target)) {
        document.getElementById('employeeList').style.display = 'none';
      }
    });

    // Default to today -- most backdated entries are for a recent day, and the
    // native date picker makes it a one-click change if not.
    document.getElementById('date').valueAsDate = new Date();

    function submit(skipWarnings) {
      var employee = selectedEmployeeName;
      var dateValue = document.getElementById('date').value; // YYYY-MM-DD
      var time = document.getElementById('time').value;

      if (!employee) { showError('Pick an employee.'); return; }
      if (!selectedType) { showError('Pick IN, OUT, or OUT OT.'); return; }
      if (!dateValue) { showError('Pick a date.'); return; }
      if (!time) { showError('Enter the time.'); return; }

      var dateParts = dateValue.split('-'); // [YYYY, MM, DD]

      showError('');
      document.getElementById('submitBtn').disabled = true;

      google.script.run
        .withSuccessHandler(function (res) { handleResult(res); })
        .withFailureHandler(function (err) {
          document.getElementById('submitBtn').disabled = false;
          showError(err.message || String(err));
        })
        .submitBackdatedEntry_({
          employeeQuery: employee,
          type: selectedType,
          year: dateParts[0], month: dateParts[1], day: dateParts[2], time: time,
          skipWarnings: !!skipWarnings
        });
    }

    function handleResult(res) {
      document.getElementById('submitBtn').disabled = false;
      if (res.ok) {
        alert(res.summary);
        google.script.host.close();
        return;
      }
      if (res.warnings && res.warnings.length) {
        var allConfirmed = res.warnings.every(function (w) { return confirm(w); });
        if (allConfirmed) {
          submit(true);
        }
        return;
      }
      showError(res.error || 'Something went wrong.');
    }

    document.getElementById('submitBtn').addEventListener('click', function () { submit(false); });
  </script>
</body>
</html>
